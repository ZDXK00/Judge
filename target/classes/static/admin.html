<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理模块</title><style>body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}.top{background:#fff;padding:18px 35px;border-bottom:1px solid #e5eaf1}.wrap{max-width:850px;margin:28px auto;background:#fff;padding:30px;border-radius:14px}button{padding:10px 16px;border:0;border-radius:7px;background:#2563eb;color:#fff;cursor:pointer;margin:5px}input,select{padding:10px;border:1px solid #d5deea;border-radius:6px;margin:5px;width:220px}.panel{display:none}.panel:target{display:block}.default{display:block}.msg{color:#2563eb;margin:15px 5px}</style></head><body><div class="top"><button onclick="location.href='/index.html'">← 返回首页</button><b>评分系统管理</b></div><div class="wrap"><section id="departments" class="panel"><h2>部门管理</h2><input id="dname" placeholder="部门名称"><button onclick="addDept()">新增部门</button><div id="dlist"></div></section><section id="users" class="panel"><h2>人员管理</h2><input id="uname" placeholder="用户名"><input id="realname" placeholder="姓名"><input id="deptid" placeholder="部门ID"><input id="upassword" placeholder="初始密码（默认123456）"><select id="role"><option>EMPLOYEE</option><option>LEADER</option></select><button onclick="addUser()">新增人员</button><div id="ulist"></div></section><section id="templates" class="panel"><h2>评分表管理</h2><input id="tname" placeholder="评分表名称"><select id="tdirection"><option value="EMPLOYEE_TO_LEADER">员工评价领导</option><option value="LEADER_TO_EMPLOYEE">领导评价员工</option></select><div id="questions"></div><button onclick="addTemplate()">创建评分表</button><div id="tmsg"></div></section><section id="tasks" class="panel"><h2>评分任务</h2><p>任务创建需要指定领导、评分表和部门，可使用 README 中的 JSON 接口示例。</p><button onclick="location.href='/index.html'">返回首页</button></section><section id="results" class="panel"><h2>评分结果</h2><p>请输入任务ID后查询：</p><input id="taskid" placeholder="任务ID"><button onclick="result()">查询</button><div id="result"></div></section></div><script>if(!sessionStorage.getItem('user'))location.href='/login.html';async function api(url,opt){let r=await fetch(url,opt);let d=await r.json();if(!r.ok)throw Error(d.message||'操作失败');return d}async function addDept(){try{await api('/api/departments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:dname.value})});dname.value='';load()}catch(e){alert(e.message)}}async function addUser(){try{await api('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:uname.value,name:realname.value,departmentId:+deptid.value,role:role.value,password:upassword.value})});alert('人员创建成功')}catch(e){alert(e.message)}}function buildQuestions(){questions.innerHTML=Array.from({length:10},(_,i)=>`<div><input class=question placeholder='第${i+1}个问题'><input class=score type=number min=1 max=10 value=10></div>`).join('')} async function addTemplate(){try{let qs=[...document.querySelectorAll('.question')],ss=[...document.querySelectorAll('.score')];let items=qs.map((q,i)=>({title:q.value,maxScore:+ss[i].value}));await api('/api/templates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:tname.value,direction:tdirection.value,items})});tmsg.textContent='评分表创建成功，已保存到数据库';}catch(e){tmsg.textContent=e.message}}async function load(){let x=await api('/api/departments');dlist.innerHTML=x.map(d=>'<p>ID '+d.id+'：'+d.name+'</p>').join('')}async function result(){try{let x=await api('/api/tasks/'+taskid.value+'/results');result.innerHTML='<p>参与人数：'+x.participantCount+'，已提交：'+x.submittedCount+'，平均分：'+x.averageScore.toFixed(2)+'</p>'}catch(e){alert(e.message)}}if(location.hash==='#departments')load();if(location.hash==='#templates')buildQuestions();</script></body></html>
