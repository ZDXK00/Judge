<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>评分工作台</title><style>body{font-family:Arial;background:#f5f7fb;margin:0;color:#172033}.top{background:#fff;padding:18px 35px}.wrap{max-width:1000px;margin:25px auto;background:#fff;padding:28px;border-radius:14px}button,select,input{padding:10px;margin:5px;border:1px solid #ccd6e5;border-radius:7px}button{background:#2563eb;color:#fff;cursor:pointer}.box{border-top:1px solid #eee;padding:20px 0}.q{margin:12px 0}.q input{width:70px}.muted{color:#64748b}</style></head><body><div class="top"><button onclick="location.href='/index.html'">返回首页</button><b>评分工作台</b></div><div class="wrap"><h2>已保存评分表</h2><div id="templates"></div><div class="box"><h2>创建评分任务</h2><input id="taskName" placeholder="任务名称"><select id="leaderId"><option value="">选择被评价领导</option></select><select id="templateId"><option value="">选择评分表</option></select><button onclick="createTask()">创建任务</button><div id="taskMsg"></div></div><div class="box"><h2>领导查看评分</h2><input id="resultTaskId" type="number" placeholder="任务ID"><button onclick="loadResults()">查看评分结果</button><div id="results"></div></div><div class="box"><h2>填写评分</h2><input id="taskId" type="number" placeholder="任务ID"><input id="evaluatorId" type="number" placeholder="评价人ID"><button onclick="loadForm()">加载评分表</button><div id="form"></div></div></div><script>if(!sessionStorage.getItem('user'))location.href='/login.html';async function api(u,o){let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.message||'请求失败');return d}async function loadTemplates(){let a=await api('/api/workflow/templates');templates.innerHTML=a.map(t=>`<div><b>ID ${t.id}：${t.name}</b> <button onclick="show(${t.id})">查看问题</button></div>`).join('');templateId.innerHTML='<option value="">选择评分表</option>'+a.map(t=>`<option value="${t.id}">${t.id}：${t.name}</option>`).join('');let u=await api('/api/workflow/users');leaderId.innerHTML='<option value="">选择被评价领导</option>'+u.filter(x=>x.role==='LEADER').map(x=>`<option value="${x.id}">${x.id}：${x.name}</option>`).join('')}async function show(id){let d=await api('/api/workflow/templates/'+id);alert(d.items.map((x,i)=>(i+1)+'. '+x.title+'（最高10分）').join('\n'))}async function createTask(){try{let d=await api('/api/workflow/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:taskName.value,leaderId:Number(leaderId.value),templateId:Number(templateId.value),departmentIds:null})});taskMsg.textContent='任务创建成功，任务ID：'+d.id}catch(e){taskMsg.textContent=e.message}}async function loadResults(){try{let a=await api('/api/workflow/tasks/'+resultTaskId.value+'/results');results.innerHTML=a.length?a.map(x=>'<p>评价人ID：'+x.evaluator.id+'，总分：'+x.totalScore+'，提交时间：'+x.submittedAt+'</p>').join(''):'暂无评分'}catch(e){alert(e.message)}}async function loadForm(){try{let d=await api('/api/workflow/tasks/'+taskId.value+'/form');form.innerHTML='<h3>'+d.task.name+'</h3>'+d.items.map((x,i)=>`<div class=q>${i+1}. ${x.title}<input type=number min=1 max=10 data-id=${x.id} value=10></div>`).join('')+'<button onclick="submitScore()">提交评分</button>'}catch(e){alert(e.message)}}async function submitScore(){let scores={};document.querySelectorAll('[data-id]').forEach(x=>scores[x.dataset.id]=+x.value);try{await api('/api/workflow/tasks/'+taskId.value+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({evaluatorId:+evaluatorId.value,scores})});alert('评分已保存')}catch(e){alert(e.message)}}loadTemplates();</script></body></html>
