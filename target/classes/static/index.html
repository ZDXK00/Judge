<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>评分系统</title>

    <style>

        body{
            margin:0;
            background:#f5f7fb;
            font-family:
                    Arial,
                    "Microsoft YaHei";
        }


        .container{

            width:500px;
            margin:100px auto;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 5px 20px #ddd;

        }


        h1{
            text-align:center;
        }


        button{

            width:100%;
            height:45px;
            margin:10px 0;

            border:0;
            border-radius:8px;

            background:#2563eb;

            color:white;

            font-size:16px;

            cursor:pointer;

        }


        button:hover{

            background:#1d4ed8;

        }


        .role-box{

            display:none;

        }



    </style>

</head>


<body>


<div class="container">


    <h1>
        评分管理系统
    </h1>


    <h3 id="welcome"></h3>


    <!-- 管理员 -->

    <div id="admin"
         class="role-box">


        <h2>
            管理员中心
        </h2>


        <button onclick="jump('/admin/admin-home.html')">
            进入管理员后台
        </button>


    </div>



    <!-- 领导 -->

    <div id="leader"
         class="role-box">


        <h2>
            领导工作台
        </h2>


        <button onclick="jump('/leader/leader-home.html')">
            进入领导页面
        </button>


    </div>



    <!-- 员工 -->

    <div id="employee"
         class="role-box">


        <h2>
            员工工作台
        </h2>


        <button onclick="jump('/employee/employee-home.html')">
            进入员工页面
        </button>


    </div>



    <button onclick="logout()">

        退出登录

    </button>


</div>




<script>


    let user =
        JSON.parse(
            sessionStorage.getItem("user")
        );



    if(!user){

        window.location.href="/login.html";

    }



    document
        .getElementById("welcome")
        .innerHTML=
        "欢迎："+user.name+
        "　身份："+user.role;



    if(user.role==="ADMIN"){

        document
            .getElementById("admin")
            .style.display="block";

    }



    if(user.role==="LEADER"){

        document
            .getElementById("leader")
            .style.display="block";

    }



    if(user.role==="EMPLOYEE"){

        document
            .getElementById("employee")
            .style.display="block";

    }




    function jump(url){

        window.location.href=url;

    }



    function logout(){

        sessionStorage.removeItem("user");

        window.location.href="/login.html";

    }



</script>



</body>

</html>
