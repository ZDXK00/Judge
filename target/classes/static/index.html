<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <title>
        评分管理系统
    </title>

    <link rel="stylesheet" href="/css/style.css">

</head>


<body>


<div class="layout">


    <!-- 左侧菜单 -->

    <div class="sidebar">


        <h2>
            评分系统
        </h2>


        <div id="userInfo"
             class="user-info">

        </div>


        <div id="menu">

        </div>



        <button class="logout"
                onclick="logout()">

            退出登录

        </button>



    </div>




    <!-- 右侧内容 -->


    <div class="content">


        <iframe

                id="mainFrame"

                src="/pages/home.html"

                frameborder="0">

        </iframe>


    </div>



</div>



<script>


    let user =
        JSON.parse(
            sessionStorage.getItem("user")
        );



    if(!user){

        location.href="/login.html";

    }



    document
        .getElementById("userInfo")
        .innerHTML=

        `
${user.name}

<br>

<span>
${user.role}
</span>

`;




    let menu =
        document.getElementById("menu");



    function addMenu(name,url){


        let div =
            document.createElement("div");


        div.className="menu-item";


        div.innerHTML=name;


        div.onclick=function(){

            document
                .getElementById("mainFrame")
                .src=url;

        }


        menu.appendChild(div);


    }




    //管理员菜单


    if(user.role==="ADMIN"){


        addMenu(
            "首页",
            "/pages/admin/home.html"
        );


        addMenu(
            "用户管理",
            "/pages/admin/users.html"
        );


        addMenu(
            "评分模板",
            "/pages/admin/templates.html"
        );


        addMenu(
            "任务发布",
            "/pages/admin/tasks.html"
        );


        addMenu(
            "全部结果",
            "/pages/admin/results.html"
        );



    }



    //领导菜单


    if(user.role==="LEADER"){


        addMenu(
            "首页",
            "/pages/leader/home.html"
        );


        addMenu(
            "待评分任务",
            "/pages/leader/score.html"
        );


        addMenu(
            "评分结果",
            "/pages/leader/result.html"
        );


    }



    //员工菜单


    if(user.role==="EMPLOYEE"){


        addMenu(
            "首页",
            "/pages/employee/home.html"
        );


        addMenu(
            "待填写评分",
            "/pages/employee/score.html"
        );


        addMenu(
            "我的结果",
            "/pages/employee/result.html"
        );


    }



    function logout(){

        sessionStorage.removeItem("user");

        location.href="/login.html";

    }



</script>



</body>


</html>
