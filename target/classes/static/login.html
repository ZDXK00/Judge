<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>领导评分系统 - 登录</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#172033;background:linear-gradient(135deg,#eef4ff,#f8fbff);min-height:100vh;display:flex;align-items:center;justify-content:center}.box{width:420px;background:#fff;border-radius:18px;padding:42px 40px;box-shadow:0 18px 50px #254b8b22}.logo{width:54px;height:54px;background:#2563eb;color:#fff;border-radius:15px;display:grid;place-items:center;font-size:26px;font-weight:700;margin-bottom:22px}.title{font-size:27px;font-weight:700;margin-bottom:8px}.sub{color:#718096;margin-bottom:30px}label{display:block;font-size:14px;font-weight:600;margin:18px 0 8px}input{width:100%;padding:13px 14px;border:1px solid #d8e0ec;border-radius:9px;font-size:15px;outline:none}input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}button{width:100%;margin-top:26px;padding:13px;background:#2563eb;border:0;border-radius:9px;color:white;font-size:16px;font-weight:600;cursor:pointer}button:hover{background:#1d4ed8}.error{height:20px;color:#dc2626;font-size:14px;margin-top:14px;text-align:center}.tip{text-align:center;color:#94a3b8;font-size:12px;margin-top:24px}</style></head><body><main class="box"><div class="logo">评</div><div class="title">领导评分系统</div><div class="sub">登录后进入评分管理平台</div><form id="form"><label>用户名</label><input id="username" autocomplete="username" placeholder="请输入用户名" required><label>密码</label><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required><button>登录系统</button><div id="error" class="error"></div></form><div class="tip">基础演示版 · 请使用管理员分配的账号</div></main><script>


    const form =
        document.getElementById("form");


    const usernameInput =
        document.getElementById("username");


    const passwordInput =
        document.getElementById("password");


    const errorBox =
        document.getElementById("error");



    form.onsubmit = async function(e){

        e.preventDefault();


        errorBox.innerHTML="";


        try{


            let response =
                await fetch(
                    "/api/auth/login",
                    {

                        method:"POST",

                        headers:
                            {
                                "Content-Type":
                                    "application/json"
                            },


                        body:
                            JSON.stringify({

                                username:
                                usernameInput.value,

                                password:
                                passwordInput.value

                            })

                    }

                );



            let data =
                await response.json();



            if(!response.ok){

                throw new Error(
                    data.message || "登录失败"
                );

            }



            /*
            保存当前登录用户

            例如：

            {
            id:1,
            name:"管理员",
            role:"ADMIN"
            }

            */

            sessionStorage.setItem(
                "user",
                JSON.stringify(data)
            );



            window.location.href=
                "/index.html";



        }catch(err){


            errorBox.innerHTML =
                err.message;


        }


    };


</script></body></html>
